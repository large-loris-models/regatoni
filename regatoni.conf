# regatoni.conf — project-wide configuration defaults
# Override locally in regatoni.local.conf (gitignored)

# === User / Environment ===
TRIAGE_BACKEND=claude              # claude or codex

# === Dependency versions ===
ALIVE2_REPO="https://github.com/regehr/alive2.git"
ALIVE2_REF="denorm-attr-fix"
ARM_TV_REPO="https://github.com/regehr/alive2.git"
ARM_TV_REF="arm-tv"
# RISCV_TV_REPO=
# RISCV_TV_REF=

# === Oracle settings ===
ORACLE_TIMEOUT=4
TRIAGE_EVERY=20

# === Alive2 options ===
ALIVE2_UNROLL=0                    # loop unrolling depth for alive2 verification (0 = disabled, try 8)

# === Fuzzer tuning ===
FUZZER_CORES=                      # empty = auto-detect
CORPUS_WEIGHT_METHOD=uniform       # uniform, feature_rarity, recency
USER_FEATURE_DOMAIN_MASK=          # empty = default (~0), 0 = disable user features
USE_PCPAIR_FEATURES=false
CALLSTACK_LEVEL=0
CROSSOVER_LEVEL=0
TIMEOUT_PER_INPUT=10
RSS_LIMIT_MB=8142

# === Redis ===
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
